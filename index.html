<!DOCTYPE html>
<html lang="en">
<head>

    <!-- Tailwind CSS CDN -->

    <!-- FontAwesome Icons CDN -->

    <style>

        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;

<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans antialiased">

    <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">

                    <i class="fa-solid font-black text-lg">▶</i>
                </div>
                <span class="font-bold text-lg tracking-wide bg-gradient-to-r from-indigo-400 to-pink-400 bg-clip-text text-transparent">
                    StreamHub

            </div>
            <div class="flex items-center gap-4 text-sm text-slate-400">
                <span class="bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 px-3 py-1 rounded-full text-xs font-semibold">

            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- Main Video Section -->
            <div class="lg:col-span-2 space-y-6">
                <!-- Embedded Video Player Frame -->
                <div class="relative w-full aspect-video rounded-2xl overflow-hidden bg-slate-900 border border-slate-800 shadow-2xl group">
                    <iframe 
                        src="https://luluvido.com/e/rtenfunc0my5" 
                        class="absolute top-0 left-0 w-full h-full border-0" 
                        allowfullscreen 
                        scrolling="no"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture">
                    </iframe>
                </div>

                <!-- Video Title & Metadata Information -->
                <div class="bg-slate-900/60 border border-slate-800 rounded-2xl p-6 backdrop-blur">
                    <div class="flex flex-wrap items-start justify-between gap-4 border-b border-slate-800/80 pb-4">
                        <div>
                            <h1 class="text-2xl font-bold text-white mb-2">Onegai AiPri - Episode 2</h1>
                            <div class="flex flex-wrap items-center gap-3 text-xs text-slate-400">
                                <span class="bg-slate-800 text-slate-300 px-2.5 py-1 rounded-md font-medium border border-slate-700/50">
                                    <i class="fa-solid fa-expand text-indigo-400 mr-1.5"></i>1920x1104
                                </span>
                                <span class="bg-slate-800 text-slate-300 px-2.5 py-1 rounded-md font-medium border border-slate-700/50">
                                    <i class="fa-regular fa-clock text-indigo-400 mr-1.5"></i>24:30
                                </span>
                                <span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2.5 py-1 rounded-md font-medium">
                                    Full HD
                                </span>
                            </div>
                        </div>

                        <!-- Action Buttons -->
                        <div class="flex items-center gap-2">
                            <a href="https://luluvido.com/rtenfunc0my5" target="_blank" rel="noopener noreferrer" 
                               class="inline-flex items-center gap-2 px-4 py-2 bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-medium text-sm rounded-xl transition-all shadow-lg shadow-indigo-600/25">
                                <i class="fa-solid fa-arrow-up-right-from-square"></i>
                                Open Source
                            </a>
                        </div>
                    </div>

                    <!-- Description / Information Block -->
                    <div class="mt-4 pt-2 text-sm text-slate-300 leading-relaxed space-y-3">
                        <p class="text-slate-400">
                            Now playing Episode 2 of <strong class="text-slate-200">Onegai AiPri</strong> in high-definition 1080p resolution.
                        </p>
                    </div>
                </div>
            </div>

            <!-- Sidebar Section (Thumbnail Preview & Source Link) -->
            <div class="lg:col-span-1 space-y-6">
                <div class="bg-slate-900/60 border border-slate-800 rounded-2xl p-5 backdrop-blur">
                    <h2 class="text-sm font-semibold tracking-wider text-slate-400 uppercase mb-4">Media Source</h2>
                    
                    <a href="https://luluvido.com/rtenfunc0my5" target="_blank" rel="noopener noreferrer" 
                       class="group block relative rounded-xl overflow-hidden border border-slate-800 bg-slate-950 transition-all hover:border-indigo-500/50 hover:shadow-xl hover:shadow-indigo-500/10">
                        <!-- Thumbnail Image -->
                        <div class="relative aspect-video overflow-hidden">
                            <img src="https://img.lulucdn.com/rtenfunc0my5_t.jpg" 
                                 alt="Onegai AiPri - E2 Thumbnail" 
                                 class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-105"
                                 onerror="this.onerror=null; this.src='https://via.placeholder.com/640x360?text=No+Thumbnail';">
                            <div class="absolute inset-0 bg-slate-950/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                                <span class="w-12 h-12 rounded-full bg-indigo-600/90 text-white flex items-center justify-center shadow-lg transform scale-90 group-hover:scale-100 transition-transform">
                                    <i class="fa-solid fa-play ml-0.5"></i>
                                </span>
                            </div>
                            <span class="absolute bottom-2 right-2 bg-slate-950/80 backdrop-blur text-xs text-white px-2 py-0.5 rounded font-mono">
                                24:30
                            </span>
                        </div>
                        
                        <!-- Details -->
                        <div class="p-4">
                            <h3 class="font-medium text-slate-200 group-hover:text-indigo-400 transition-colors line-clamp-1">
                                Onegai AiPri - E2
                            </h3>
                            <p class="text-xs text-slate-500 mt-1 flex items-center gap-2">
                                <span>1920x1104</span> • <span>luluvido.com</span>
                            </p>
                        </div>
                    </a>
                </div>
            </div>

        </div>
    </main>

</body>
</html>
